name: Qualité

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint HTML/CSS/JS + liens + sitemap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:html
      - run: npm run lint:css
      - run: npm run lint:js
      - run: npm run check:links
      - name: Index de recherche à jour
        run: |
          npm run search:build
          git diff --exit-code assets/data/search-index.json || { echo "::error::search-index.json est périmé : lancez npm run search:build et commitez"; exit 1; }
